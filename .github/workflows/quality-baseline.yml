name: Quality baseline

on:
  pull_request:
  # Verifica também o que já entrou na main. Sem isto, um merge pela interface do
  # GitHub ou um push direto chegava à main — e, por consequência, ao deploy de
  # produção da Vercel — sem nenhuma verificação automatizada.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-baseline-${{ github.ref }}
  # Em PR, um push novo torna o run anterior irrelevante: cancelar economiza fila.
  # Na main, cada commit é o que está publicado, então o resultado dele importa por
  # si só — cancelar deixaria um commit já implantado sem veredito.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Type baseline, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ""
      VITE_SUPABASE_URL: "https://example.supabase.co"
      # Os dois nomes: o cliente prefere PUBLISHABLE e cai em ANON como
      # compatibilidade. Definir ambos mantém o build determinístico mesmo quando
      # o fallback legado for removido. Valores são placeholders públicos.
      VITE_SUPABASE_PUBLISHABLE_KEY: "ci-public-placeholder"
      VITE_SUPABASE_ANON_KEY: "ci-public-placeholder"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify known TypeScript baseline
        run: npm run typecheck:baseline

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
