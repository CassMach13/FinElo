<script>
// Keep the exact module URL used by static application imports. Vite rewrites dynamic TS imports with ?import.
window.__financialNativeImport = source => {
  const url = new URL(source, location.origin);
  if (url.origin !== location.origin || !/^\/(src|scripts\/diagnostics\/theme-financial-baseline\/src)\//.test(url.pathname)) throw Error('Módulo fora da referência');
  return import(url.href);
};
