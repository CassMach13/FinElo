<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinElo · Importação sintética isolada</title></head><body><div id="root"></div>
<script>
window.__importNativeModule = source => {
  const url=new URL(source,location.origin);
  if(url.origin!==location.origin || !/^\/(src|scripts\/diagnostics\/theme-import-(main|reviewed)-baseline\/src)\//.test(url.pathname))throw Error('Módulo fora da referência');
  return import(url.href);
};
</script><script type="module" src="/scripts/diagnostics/import-preview.tsx"></script></body></html>
